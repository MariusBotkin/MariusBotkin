pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.application' version '8.7.3'
    }
}

rootProject.name = 'atak-sdr-alert'

// "core" : Java pur (DSP, détection, rtl_tcp, CoT), compilable et testable partout.
include 'core'

// "app" : l'application Android autonome. Incluse seulement si un SDK Android est
// présent (GitHub Actions, Android Studio), pour que "gradle :core:test" marche sans.
if (System.getenv('ANDROID_HOME') || System.getenv('ANDROID_SDK_ROOT') || file('local.properties').exists()) {
    include 'app'
}

// Le dossier "plugin" (plugin ATAK) se compile dans le SDK ATAK-CIV : voir plugin/README.md.
