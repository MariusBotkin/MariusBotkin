plugins {
    id 'com.android.application'
}

repositories {
    google()
    mavenCentral()
}

def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'fr.mariusbotkin.sdralert.app'
    compileSdk 35

    defaultConfig {
        applicationId 'fr.mariusbotkin.sdralert'
        minSdk 24
        targetSdk 35
        versionCode buildNumber
        versionName "0.1.${buildNumber}"
    }

    // Clé de signature fixe (non secrète, comme une clé debug) : chaque nouvelle
    // compilation s'installe par-dessus la précédente sans désinstaller.
    signingConfigs {
        shared {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation project(':core')
}
