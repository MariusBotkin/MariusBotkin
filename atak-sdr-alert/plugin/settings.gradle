pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

// Le nom apparaît dans le nom de l'APK : ATAK-Plugin-SdrAlerte-<version>-...-<version ATAK>.apk
rootProject.name = 'SdrAlerte'
include ':app'
