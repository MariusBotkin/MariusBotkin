plugins {
    id 'java-library'
}

java {
    // Java 8 pour rester compatible avec la chaîne de build Android du SDK ATAK.
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:-options'
}

// Petit outil console : surveille une bande via un serveur rtl_tcp (PC ou téléphone).
tasks.register('runCli', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'fr.mariusbotkin.sdralert.core.engine.MonitorCli'
    standardInput = System.in
    if (project.hasProperty('cliArgs')) {
        args project.property('cliArgs').toString().split(' ')
    }
}
